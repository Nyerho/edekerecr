<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Receipt - Eghale Cold Room | Edekere Richmond Sons and Ventures</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <header class="header-brand no-print">
    <div class="container">
      <div class="d-flex align-items-center justify-content-between flex-wrap gap-3">
        <div class="d-flex align-items-center gap-3">
          <div class="logo-upload" id="logoUpload" title="Click to upload logo">🏪</div>
          <input type="file" id="logoInput" accept="image/*" style="display:none">
          <div>
            <h1>Eghale Cold Room</h1>
            <small class="text-white-50">Receipt · Edekere Richmond Sons &amp; Ventures</small>
          </div>
        </div>
        <div class="d-flex align-items-center gap-2 flex-wrap">
          <div id="syncStatus" class="sync-status" style="display:none">
            <span class="dot"></span> Synced
          </div>
          <div id="authStatusContainer"></div>
          <a href="index.html" class="btn btn-outline-light btn-sm">
            🛒 Sales
          </a>
          <a href="login.html?redirect=admin.html" class="btn btn-outline-light btn-sm">
            ⚙️ Admin
          </a>
        </div>
      </div>
    </div>
  </header>

  <div class="container mt-4 mb-4">
    <div class="row justify-content-center no-print mb-4">
      <div class="col-md-6 text-center">
        <h3 class="fade-in-down">🧾 Sales Receipt</h3>
        <p class="text-muted">Your transaction has been recorded successfully</p>
      </div>
    </div>

    <div id="receiptContent">
    </div>

    <div class="row justify-content-center mt-4 no-print">
      <div class="col-md-6 text-center d-grid gap-2">
        <button class="btn btn-primary big-btn" onclick="window.print()">
          🖨️ Print Receipt
        </button>
        <a href="index.html" class="btn btn-success big-btn">
          ← Back to Sales
        </a>
        <a href="receipt.html?autoPrint=1" class="btn btn-outline-secondary">
          🔄 Reload &amp; Auto Print
        </a>
      </div>
    </div>
  </div>

  <div id="globalFooter"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
