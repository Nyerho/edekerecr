<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eghale Cold Room - POS Sales | Edekere Richmond Sons and Ventures</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <header class="header-brand">
    <div class="container">
      <div class="d-flex align-items-center justify-content-between flex-wrap gap-3">
        <div class="d-flex align-items-center gap-3">
          <div class="logo-upload" id="logoUpload" title="Click to upload logo">🏪</div>
          <input type="file" id="logoInput" accept="image/*" style="display:none">
          <div>
            <h1>Eghale Cold Room</h1>
            <small class="text-white-50">Edekere Richmond Sons &amp; Ventures · Cold Room POS System</small>
          </div>
        </div>
        <div class="d-flex align-items-center gap-2 flex-wrap">
          <div id="syncStatus" class="sync-status" style="display:none">
            <span class="dot"></span> Synced
          </div>
          <div id="authStatusContainer"></div>
          <a href="index.html" class="btn btn-light btn-sm">
            🛒 Sales
          </a>
          <a href="login.html?redirect=admin.html" class="btn btn-outline-light btn-sm">
            ⚙️ Admin
          </a>
        </div>
      </div>
    </div>
  </header>

  <div class="shift-status-bar shift-closed" id="shiftStatusBar">
    <span class="fw-bold">⏳ Loading shift status...</span>
  </div>

  <div class="container mt-4 mb-4">
    <div class="row">
      <div class="col-lg-8">
        <ul class="nav nav-tabs mb-4" id="productTabs" role="tablist">
          <li class="nav-item" role="presentation">
            <button class="nav-link active" id="tab-chicken" type="button" role="tab">
              🐔 Chicken Products
            </button>
          </li>
          <li class="nav-item" role="presentation">
            <button class="nav-link" id="tab-fish" type="button" role="tab">
              🐟 Fish Products
            </button>
          </li>
        </ul>

        <div class="tab-content" id="tabsContent">
          <div class="tab-pane fade show active">
            <div class="row" id="products-container">
            </div>
          </div>
        </div>
      </div>

      <div class="col-lg-4">
        <div class="cart-section">
          <div class="cart-header d-flex justify-content-between align-items-center">
            <h4>🛒 Cart</h4>
            <span class="badge bg-light text-dark" id="cart-count">0 items</span>
          </div>
          <div class="cart-items" id="cart-items">
          </div>
          <div class="cart-footer">
            <div class="d-flex justify-content-between mb-3 align-items-center">
              <span class="fw-semibold fs-5">TOTAL:</span>
              <span class="total-amount" id="cart-total">₦0.00</span>
            </div>
            <div class="d-grid gap-2">
              <button class="btn btn-success big-btn" onclick="handleCompleteSale()">
                ✅ Complete Sale
              </button>
              <button class="btn btn-primary big-btn" onclick="handlePrintReceipt()">
                🖨️ Print Receipt
              </button>
              <button class="btn btn-outline-danger" onclick="clearCart(); renderCart();">
                🗑️ Clear Cart
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="modal fade" id="productModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">
            <span id="modalProductIcon">📦</span>
            <span id="modalProductName">Product Name</span>
          </h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body p-4">
          <div class="text-center mb-4">
            <div class="fs-5 fw-semibold" id="modalProductPrice">₦0.00</div>
            <div class="text-muted" id="modalProductStock">0 available</div>
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold mb-2">Quantity:</label>
            <div class="d-flex align-items-center justify-content-center gap-3">
              <button type="button" class="btn btn-outline-secondary quantity-btn rounded-circle" onclick="changeModalQty(-1)">−</button>
              <input type="number" class="form-control quantity-input rounded-3" id="modalQuantity" value="1" min="1" onchange="updateModalSubtotal()">
              <button type="button" class="btn btn-outline-secondary quantity-btn rounded-circle" onclick="changeModalQty(1)">+</button>
            </div>
          </div>
          <div class="d-flex justify-content-between align-items-center p-3 bg-light rounded-3 mt-4">
            <span class="fw-semibold fs-5">Subtotal:</span>
            <span class="fw-bold fs-3 text-success" id="modalSubtotal">₦0.00</span>
          </div>
        </div>
        <div class="modal-footer flex-column gap-2">
          <button type="button" class="btn btn-success big-btn w-100" onclick="addFromModalToCart()">
            🛒 Add to Cart
          </button>
          <button type="button" class="btn btn-outline-secondary w-100" data-bs-dismiss="modal">
            Cancel
          </button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/app.js"></script>
  <script>
    const originalRenderCart = renderCart;
    renderCart = function() {
      originalRenderCart();
      const cartCount = document.getElementById('cart-count');
      if (cartCount) {
        const totalItems = cart.reduce((sum, item) => sum + item.quantity, 0);
        cartCount.textContent = totalItems + ' item' + (totalItems !== 1 ? 's' : '');
      }
    };
  </script>
</body>
</html>
